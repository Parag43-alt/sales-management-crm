<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosho CRM - Register</title>
    <style>
        /* SAME COSMIC CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #030108; overflow: hidden; perspective: 1200px; }
        .background-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
        .cosmic-background { background: linear-gradient(-45deg, hsl(265, 80%, 8%), hsl(230, 70%, 10%), hsl(300, 75%, 12%), hsl(210, 70%, 9%), hsl(265, 80%, 8%)); background-size: 400% 400%; animation: cosmicDrift 35s ease infinite; z-index: -5; filter: brightness(0.8); opacity: 1; }
        .container { position: absolute; top: 50%; left: 50%; width: 400px; padding: 40px 30px; border-radius: 20px; transform: translate(-50%, -50%); z-index: 10; background: rgba(30, 20, 50, 0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(180, 160, 220, 0.3); box-shadow: 0 12px 60px 8px rgba(5, 2, 10, 0.7); }
        .card-content { color: #e0e0ff; text-align: center; }
        .card-content h2 { margin-bottom: 25px; font-size: 2em; font-weight: 600; color: #fff; text-shadow: 0 0 15px rgba(210, 210, 255, 0.7); }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #c0c0f0; }
        .input-group input, .input-group select { width: 100%; padding: 12px 15px; background-color: rgba(0, 0, 10, 0.45); border: 1px solid rgba(150, 130, 190, 0.55); border-radius: 8px; color: #fff; font-size: 1em; outline: none; }
        .input-group select option { background-color: #1e1432; color: #fff; }
        .login-button { display: inline-block; padding: 12px 35px; margin-top: 10px; background: linear-gradient(45deg, #6a11cb, #2575fc); color: #fff; border: none; border-radius: 50px; font-weight: bold; font-size: 1.1em; cursor: pointer; width: 100%; box-shadow: 0 6px 25px rgba(40, 30, 80, 0.5); }
        .login-button:hover { background: linear-gradient(45deg, #7a22db, #3585fd); }
        #message { font-size: 0.9em; margin-top: 15px; min-height: 20px; }
        .link { color: #a8b0ff; text-decoration: none; font-size: 0.85em; display: block; margin-top: 20px; }
        .link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="background-layer cosmic-background"></div>
    
    <div class="container">
        <div class="card-content">
            <h2>Create Account</h2>
            
            <div class="input-group">
                <label>Email (Username)</label>
                <input type="email" id="username" placeholder="Enter your email" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label>Select Your Role</label>
                <select id="role" required>
                    <option value="sales_rep">Sales Representative</option>
                    <option value="sales_manager">Sales Manager</option>
                    <option value="account_manager">Account Manager</option>
                    <option value="marketing">Marketing Team</option>
                    <option value="product_manager">Product Manager</option>
                    <option value="executive">Executive Leadership</option>
                </select>
            </div>

            <button class="login-button" id="registerBtn">Register</button>
            <div id="message"></div>
            
            <a href="/login" class="link">Already have an account? Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const msgBox = document.getElementById('message');

            if (!username || !password) {
                msgBox.style.color = '#ff6b6b';
                msgBox.innerText = 'Please fill all fields.';
                return;
            }

            try {
                const response = await fetch("/api/v1/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, role })
                });

                if (response.ok) {
                    msgBox.style.color = '#4ade80';
                    msgBox.innerText = 'Account Created! Redirecting to login...';
                    setTimeout(() => { window.location.href = "/"; }, 2000);
                } else {
                    const data = await response.json();
                    msgBox.style.color = '#ff6b6b';
                    msgBox.innerText = data.detail || "Registration failed.";
                }
            } catch (error) {
                msgBox.style.color = '#ff6b6b';
                msgBox.innerText = "Server error.";
            }
        });
    </script>
</body>
</html>
